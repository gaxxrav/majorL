<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Store - Barcode Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome to Barcode Scanner</h1>
            <p class="text-gray-600">Please select your store to continue</p>
        </div>

        <div id="store-selection" class="mb-6">
            <div class="mb-4">
                <label for="store-id" class="block text-sm font-medium text-gray-700 mb-2">Enter Store ID</label>
                <div class="flex space-x-2">
                    <input type="text" id="store-id" 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="e.g., STORE001" required>
                    <button id="verify-store" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Verify
                    </button>
                </div>
                <p id="store-error" class="mt-1 text-sm text-red-600 hidden">Please enter a valid store ID</p>
            </div>

            <div id="store-info" class="hidden p-4 bg-blue-50 rounded-md mb-4">
                <h3 class="font-semibold text-lg text-gray-800" id="store-name"></h3>
                <p class="text-gray-600" id="store-location"></p>
            </div>

            <div class="mt-6">
                <button id="continue-btn" 
                        class="w-full py-2 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled>
                    Continue to Scanner
                </button>
            </div>
        </div>

        <div id="store-list" class="mt-8">
            <h3 class="text-lg font-medium text-gray-900 mb-3">Available Stores</h3>
            <div class="space-y-3" id="stores-container">
                <!-- Stores will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const storeIdInput = document.getElementById('store-id');
            const verifyBtn = document.getElementById('verify-store');
            const storeInfo = document.getElementById('store-info');
            const storeName = document.getElementById('store-name');
            const storeLocation = document.getElementById('store-location');
            const storeError = document.getElementById('store-error');
            const continueBtn = document.getElementById('continue-btn');
            const storesContainer = document.getElementById('stores-container');

            // Load available stores
            fetch('/api/stores')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.stores) {
                        displayStores(data.stores);
                    }
                })
                .catch(error => console.error('Error loading stores:', error));

            // Display available stores
            function displayStores(stores) {
                storesContainer.innerHTML = '';
                
                Object.entries(stores).forEach(([id, store]) => {
                    const storeElement = document.createElement('div');
                    storeElement.className = 'p-3 border border-gray-200 rounded-md hover:bg-gray-50 cursor-pointer';
                    storeElement.innerHTML = `
                        <div class="font-medium">${store.name}</div>
                        <div class="text-sm text-gray-500">${store.location}</div>
                        <div class="text-xs text-blue-600 mt-1">${id}</div>
                    `;
                    
                    storeElement.addEventListener('click', () => {
                        storeIdInput.value = id;
                        verifyStore(id);
                    });
                    
                    storesContainer.appendChild(storeElement);
                });
            }

            // Verify store ID
            function verifyStore(storeId) {
                fetch(`/api/verify-store/${storeId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            storeName.textContent = data.store.name;
                            storeLocation.textContent = data.store.location;
                            storeInfo.classList.remove('hidden');
                            storeError.classList.add('hidden');
                            continueBtn.disabled = false;
                            
                            // Store in session
                            return fetch('/api/select-store', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ store_id: storeId })
                            });
                        } else {
                            throw new Error('Invalid store ID');
                        }
                    })
                    .catch(error => {
                        storeError.textContent = 'Invalid store ID. Please try again.';
                        storeError.classList.remove('hidden');
                        storeInfo.classList.add('hidden');
                        continueBtn.disabled = true;
                    });
            }

            // Event listeners
            verifyBtn.addEventListener('click', () => {
                const storeId = storeIdInput.value.trim();
                if (storeId) {
                    verifyStore(storeId);
                } else {
                    storeError.textContent = 'Please enter a store ID';
                    storeError.classList.remove('hidden');
                }
            });

            storeIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    verifyBtn.click();
                }
            });

            continueBtn.addEventListener('click', () => {
                window.location.href = '/scanner';
            });
        });
    </script>
</body>
</html>
